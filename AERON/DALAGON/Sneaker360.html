<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sneaker 360</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg1:#f0ece5;--bg2:#d4cfc4;--spot:rgba(255,255,255,.75);--ink:#1d1b18;--mute:#6f6a60;--line:rgba(29,27,24,.3);--shadow:rgba(20,18,14,.38);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#37352f;--bg2:#1d1c19;--spot:rgba(239,227,207,.3);--ink:#efe3cf;--mute:#a39c8e;--line:rgba(239,227,207,.35);--shadow:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg1:#37352f;--bg2:#1d1c19;--spot:rgba(239,227,207,.3);--ink:#efe3cf;--mute:#a39c8e;--line:rgba(239,227,207,.35);--shadow:rgba(0,0,0,.6)}
html,body{height:100%;margin:0}
body{background:var(--bg2);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;overflow:hidden}
#stage{position:relative;height:100%;overflow:hidden;cursor:grab;touch-action:none;perspective:1700px;perspective-origin:50% 45%;background:radial-gradient(ellipse 70% 60% at 50% 46%,var(--spot),transparent 70%),linear-gradient(var(--bg1),var(--bg2))}
#stage.drag{cursor:grabbing}
#shoe{position:absolute;left:50%;top:44%;user-select:none;-webkit-user-drag:none;pointer-events:none;opacity:0}
#sh{position:absolute;left:50%;height:30px;border-radius:50%;background:radial-gradient(ellipse,var(--shadow),transparent 70%);transform:translateX(-50%)}
footer{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;justify-content:space-between;align-items:center;padding:0 24px}
#cap{font-size:15px;color:var(--mute)}
button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 18px;cursor:pointer}
button:hover{background:var(--line)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>

  <footer><span id="cap">Drag to spin</span><button id="btn" type="button">Pause</button></footer>
</div>
<script>
const AR=1.8212;
const stage=document.getElementById('stage'),shoe=document.getElementById('shoe'),sh=document.getElementById('sh'),btn=document.getElementById('btn');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let ry=-20,rx=0,playing=!reduce,last=performance.now(),drag=null,fade=0,W=0,H=0;
function size(){
  const w=stage.clientWidth,h=stage.clientHeight;
  H=Math.min(h*.5,w*.86/AR);W=H*AR;
  shoe.style.width=W+'px';shoe.style.height=H+'px';shoe.style.marginLeft=(-W/2)+'px';shoe.style.marginTop=(-H/2)+'px';
}
size();addEventListener('resize',size);
function tick(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  fade=Math.min(1,fade+dt/.8);
  if(playing&&!drag)ry+=dt*50;   /* one full turn in about 7 seconds */
  shoe.style.opacity=fade;
  shoe.style.transform='rotateX('+rx+'deg) rotateY('+ry+'deg)';
  const c=Math.abs(Math.cos(ry*Math.PI/180));
  sh.style.width=(W*(.25+.6*c))+'px';
  sh.style.top=(stage.clientHeight*.44+H*.5+14)+'px';
  sh.style.opacity=fade*(.5+.5*c);
  requestAnimationFrame(tick);
}
stage.addEventListener('pointerdown',ev=>{drag={x:ev.clientX,y:ev.clientY,ry:ry,rx:rx};stage.classList.add('drag');stage.setPointerCapture(ev.pointerId)});
stage.addEventListener('pointermove',ev=>{if(drag){ry=drag.ry+(ev.clientX-drag.x)*.5;rx=Math.max(-35,Math.min(35,drag.rx-(ev.clientY-drag.y)*.3))}});
const end=()=>{drag=null;stage.classList.remove('drag')};
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
btn.addEventListener('click',()=>{playing=!playing;btn.textContent=playing?'Pause':'Spin'});
if(reduce)btn.textContent='Spin';
requestAnimationFrame(tick);
</script>
